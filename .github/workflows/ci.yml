name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
# Never cancel runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The storefront needs these only so its SDK module loads during `next build`.
      # They are placeholders, not real credentials.
      MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter storefront lint
      - run: pnpm --filter storefront build
      - run: pnpm --filter commerce lint
      - run: pnpm --filter commerce build
